jenkins:
  systemMessage: "PoliServis CI/CD - Configurado automaticamente"
  numExecutors: 2
  scmCheckoutRetryCount: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Admin"
          password: "admin"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: true

tool:
  maven:
    installations:
      - name: "3.9"
        home: "/usr/share/maven"

unclassified:
  location:
    url: "http://localhost:8082/"

jobs:
  - script: |
      pipelineJob('Poliservice_Job') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/JakeBenavides/GR06_1BT3_622_26A.git')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }